# ==================================
# Cấu hình Buffer Ghi (Write Buffer)
# ==================================
# Kích hoạt tính năng gom lô (batch) của Hibernate và số lượng câu lệnh trong 1 lô
spring.jpa.properties.hibernate.jdbc.batch_size=50
# Yêu cầu Hibernate sắp xếp các câu lệnh giống nhau lại với nhau để tối ưu tốc độ gửi
spring.jpa.properties.hibernate.order_updates=true

# Cấu hình thời gian xả buffer cho bộ đệm In-Memory tự code (ms)
app.buffer.progress.flush-delay-ms=10000